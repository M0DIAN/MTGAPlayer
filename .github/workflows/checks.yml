name: core-and-native-probe
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: mtgaplayer replay examples/synthetic.jsonl
      - run: mtgaplayer dry-run examples/synthetic.jsonl
      - name: Tested revision
        run: git show -s --format='%H %T %P'
  native-no-input:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: mtgaplayer doctor
      - name: Tested revision
        run: git show -s --format='%H %T %P'
